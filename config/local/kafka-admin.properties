# Disposable/local Docker network only. Never use these credentials outside local development.
bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
security.protocol=SASL_PLAINTEXT
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="local-admin-only";
