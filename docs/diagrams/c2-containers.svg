<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Usage Billing — C2 컨테이너 다이어그램</title>
  <desc id="desc">단순화 목표 컨테이너 관계를 표시한다. 외부 VM 발생기가 Kafka에 직접 발행하고 ClickHouse가 직접 소비한다. 별도 접수 API나 원장 적재기 컨테이너는 없다. 사용자는 웹과 BFF로 귀속 완료 데이터와 PostgreSQL 정보를 조회한다. 배치는 ClickHouse를 조회하고 PostgreSQL에 확정 결과를 기록한다. 직접 소비의 검증·격리·복구는 구현 전 검증 대상이며 점유·귀속·캐시 배치는 미정이다. CH는 동일 저장소를 반복 표시한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52657b" stroke-width="1.5"/></marker>
    <style>
      text { font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #182b42; }
      .heading { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #52657b; }
      .name { font-size: 22px; font-weight: 700; text-anchor: middle; }
      .type { font-size: 15px; fill: #42607e; text-anchor: middle; }
      .detail { font-size: 16px; text-anchor: middle; }
      .edge { fill: none; stroke: #52657b; stroke-width: 2; marker-end: url(#arrow); }
      .label { font-size: 15px; fill: #42576d; text-anchor: middle; paint-order: stroke; stroke: #fbfcfe; stroke-width: 7px; stroke-linejoin: round; }
      .app { fill: #edf5ff; stroke: #507fb3; stroke-width: 1.5; }
      .store { fill: #eef7f5; stroke: #478073; stroke-width: 1.5; }
      .external { fill: #f2f4f7; stroke: #8290a0; stroke-width: 1.5; }
      .note { font-size: 17px; fill: #42576d; }
    </style>
  </defs>
  <rect width="1680" height="1080" fill="#fff"/>
  <text x="42" y="58" class="heading">Cloud Usage Billing</text>
  <text x="42" y="92" class="subtitle">C2 · Container diagram / 단순화 목표 구조 · 직접 소비 검증·구현 전</text>
  <rect x="310" y="145" width="1320" height="765" rx="12" fill="#fbfcfe" stroke="#a3b2c2" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="338" y="180" font-size="18" font-weight="700">클라우드 사용량 정산 시스템</text>

  <!-- Container relationships. Arrows denote calls / writes; responses omitted. -->
  <path class="edge" d="M255 295 H360"/>
  <text class="label" x="305" y="269">직접 발행</text>
  <path class="edge" d="M590 295 H1040"/>
  <text class="label" x="815" y="263">이벤트 전달 · ClickHouse가 직접 소비</text>
  <path class="edge" d="M255 755 H360"/>
  <text class="label" x="305" y="728">화면 사용</text>
  <path class="edge" d="M590 755 H700"/>
  <text class="label" x="645" y="728">조회·관리 요청</text>
  <path class="edge" d="M815 700 V590"/>
  <text class="label" x="815" y="638">인증·권한 / 확정 조회</text>
  <text class="label" x="815" y="660">구성원 권한 관리</text>
  <path class="edge" d="M930 755 H1040"/>
  <text class="label" x="985" y="711">귀속 데이터</text>
  <text class="label" x="985" y="734">비용 조회</text>
  <path class="edge" d="M1380 755 H1270"/>
  <text class="label" x="1325" y="723">재계산 조회</text>
  <path class="edge" d="M1495 700 V535 H930"/>
  <text class="label" x="1200" y="513">정산 실행 상태 · 확정 결과 기록</text>

  <!-- External actor and system. -->
  <rect class="external" x="40" y="240" width="215" height="110" rx="8"/>
  <text class="name" x="147" y="277">VM 발생기들</text>
  <text class="type" x="147" y="304">외부 시스템</text>
  <text class="detail" x="147" y="330">직접 발행 · 실패 시 재시도</text>
  <rect class="external" x="40" y="700" width="215" height="110" rx="8"/>
  <text class="name" x="147" y="742">사용자</text>
  <text class="type" x="147" y="775">관리자 · 조회자</text>

  <!-- Confirmed application containers. -->
  <rect class="store" x="360" y="240" width="230" height="110" rx="8"/>
  <text class="name" x="475" y="277">Kafka</text>
  <text class="type" x="475" y="304">입력 분산 · 적체 보존</text>
  <text class="detail" x="475" y="330">장애 후 재전달</text>
  <rect class="store" x="1040" y="240" width="230" height="110" rx="8"/>
  <text class="name" x="1155" y="277">ClickHouse [CH]</text>
  <text class="type" x="1155" y="304">직접 소비 · 검증 · 격리</text>
  <text class="detail" x="1155" y="330">사용량 저장 · 분석</text>
  <rect class="store" x="700" y="480" width="230" height="110" rx="8"/>
  <text class="name" x="815" y="517">PostgreSQL</text>
  <text class="type" x="815" y="544">운영 원장 · 확정 결과</text>
  <text class="detail" x="815" y="570">권한 · 점유 · 가격 · 정산</text>
  <rect class="app" x="360" y="700" width="230" height="110" rx="8"/>
  <text class="name" x="475" y="737">웹 대시보드</text>
  <text class="detail" x="475" y="776">비용 · 정산 · 권한 화면</text>
  <rect class="app" x="700" y="700" width="230" height="110" rx="8"/>
  <text class="name" x="815" y="737">BFF · 인증/인가</text>
  <text class="detail" x="815" y="776">회사별 접근 제어 · 응답 조합</text>
  <rect class="store" x="1040" y="700" width="230" height="110" rx="8"/>
  <text class="name" x="1155" y="737">ClickHouse [CH]</text>
  <text class="type" x="1155" y="764">동일 저장소 반복 표기</text>
  <text class="detail" x="1155" y="790">귀속 데이터 · 요청 시 집계</text>
  <rect class="app" x="1380" y="700" width="230" height="110" rx="8"/>
  <text class="name" x="1495" y="737">월간 정산 배치</text>
  <text class="detail" x="1495" y="776">월간 금액 검증 · 확정</text>
  <text x="340" y="872" class="subtitle">애플리케이션·저장소 단위만 표시 · 컨테이너 내부 구성요소 및 복제 수는 생략</text>
  <text x="42" y="962" class="note">접수 API·별도 적재기 없이 연결합니다. ClickHouse의 검증·격리·중복 처리·장애 복구는 검증할 목표입니다.</text>
  <text x="42" y="998" class="note">미정: 점유 제어·귀속·캐시 배치. 원시 → 귀속 완료 경로는 생략했으며 Kafka ACK만으로 과금하지 않습니다.</text>
  <text x="42" y="1034" class="note">[CH]는 동일 저장소 반복 표기입니다. BFF는 귀속 완료 데이터만 읽으며 실제 결제는 범위 밖입니다.</text>
</svg>
