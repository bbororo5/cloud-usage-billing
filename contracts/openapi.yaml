openapi: 3.1.0
info:
  title: Cloud Usage Billing API
  version: 1.0.0
  description: 사용자 BFF와 사용량 수집 API 계약
servers:
  - url: /api/v1
tags:
  - name: Session
    description: 사용자 인증 상태
  - name: Costs
    description: 예상 비용 분석
  - name: Settlements
    description: 월간 확정 결과
  - name: Usage
    description: 원본 사용량
  - name: Members
    description: 과금 역할 관리
  - name: Ingestion
    description: 사용량 이벤트 수집
paths:
  /session:
    post:
      tags: [Session]
      operationId: createSession
      summary: 로그인
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: 로그인 성공
          headers:
            Set-Cookie:
              schema:
                type: string
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Session]
      operationId: deleteSession
      summary: 로그아웃
      security:
        - UserSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: 로그아웃 성공 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    get:
      tags: [Session]
      operationId: getCurrentUser
      summary: 현재 사용자·회사·역할 조회
      security:
        - UserSession: []
      responses:
        '200':
          description: 현재 인증 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /costs:
    get:
      tags: [Costs]
      operationId: queryCosts
      summary: 예상 비용 조회
      description: groupBy가 없으면 선택 기간 총액을 반환한다.
      security:
        - UserSession: []
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: serviceCategory
          in: query
          schema:
            type: string
            enum: [Compute, Storage, Networking]
        - name: resourceId
          in: query
          schema: { type: string, minLength: 1 }
        - name: groupBy
          in: query
          description: 쉼표로 구분하며 최대 2개
          style: form
          explode: false
          schema:
            type: array
            maxItems: 2
            uniqueItems: true
            items:
              type: string
              enum: [day, service, resource]
        - name: sort
          in: query
          schema:
            type: string
            enum: [cost, usage, period]
            default: cost
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: 예상 비용 집계
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /settlements/{billingMonth}:
    get:
      tags: [Settlements]
      operationId: getSettlement
      summary: 월간 확정 금액 조회
      security:
        - UserSession: []
      parameters:
        - name: billingMonth
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          example: 2026-07
      responses:
        '200':
          description: 확정 정산 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /usage-records:
    get:
      tags: [Usage]
      operationId: listUsageRecords
      summary: 원본 사용량 상세 조회
      security:
        - UserSession: []
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: serviceCategory
          in: query
          schema:
            type: string
            enum: [Compute, Storage, Networking]
        - name: resourceId
          in: query
          schema: { type: string, minLength: 1 }
        - name: cursor
          in: query
          description: 서버가 발급한 불투명한 다음 페이지 커서
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: 원본 사용량 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageRecordPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /billing-members:
    get:
      tags: [Members]
      operationId: listBillingMembers
      summary: 과금 구성원과 역할 조회
      security:
        - UserSession: []
      responses:
        '200':
          description: 현재 회사의 과금 구성원
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BillingMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /billing-members/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Members]
      operationId: putBillingMemberRole
      summary: 과금 역할 부여 또는 변경
      security:
        - UserSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/BillingRole' }
              additionalProperties: false
      responses:
        '200':
          description: 변경된 구성원
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Members]
      operationId: deleteBillingMemberRole
      summary: 과금 역할 제거
      security:
        - UserSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: 역할 제거 성공 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /usage-events:
    post:
      tags: [Ingestion]
      operationId: ingestUsageEvent
      summary: 사용량 이벤트 검증 및 Kafka 내구성 기록
      description: 인증된 발생기만 호출한다. 자격 증명의 발급·회전 방식은 수집 구현 전 확정한다.
      security:
        - ProducerCredential: []
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: './v1/instance-usage-event.schema.json'
      responses:
        '202': { description: Kafka에 내구성 있게 기록됨 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    UserSession:
      type: apiKey
      in: cookie
      name: SESSION
      description: HttpOnly·Secure·SameSite=Strict 서버 세션 쿠키
    ProducerCredential:
      type: http
      scheme: bearer
      bearerFormat: opaque-producer-credential
      description: 이벤트 발생기용 불투명 자격 증명
  parameters:
    From:
      name: from
      in: query
      required: true
      description: 포함되는 UTC 분 경계 시작 시각
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      required: true
      description: 제외되는 UTC 분 경계 종료 시각, from부터 최대 31일
      schema: { type: string, format: date-time }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    BillingRole:
      type: string
      enum: [BILLING_ACCOUNT_VIEWER, BILLING_ACCOUNT_ADMIN]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 1 }
      additionalProperties: false
    CurrentUser:
      type: object
      required: [userId, displayName, billingAccountId, billingAccountName, role]
      properties:
        userId: { type: string }
        displayName: { type: string }
        billingAccountId: { type: string }
        billingAccountName: { type: string }
        role: { $ref: '#/components/schemas/BillingRole' }
    Period:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    CostDimensions:
      type: object
      properties:
        day: { type: string, format: date }
        service: { type: string, enum: [Compute, Storage, Networking] }
        resource: { type: string }
      additionalProperties: false
    UsageAmount:
      type: object
      required: [meter, quantity, unit]
      properties:
        meter: { type: string }
        quantity: { type: integer, minimum: 0 }
        unit: { type: string }
    CostItem:
      type: object
      required: [dimensions, estimatedCost, usage]
      properties:
        dimensions: { $ref: '#/components/schemas/CostDimensions' }
        estimatedCost: { type: number }
        usage:
          type: array
          items: { $ref: '#/components/schemas/UsageAmount' }
    CostResponse:
      type: object
      required: [period, dataAsOf, currency, groupBy, items]
      properties:
        period: { $ref: '#/components/schemas/Period' }
        dataAsOf: { type: [string, 'null'], format: date-time }
        currency: { type: string, const: KRW }
        groupBy:
          type: array
          maxItems: 2
          items: { type: string, enum: [day, service, resource] }
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/CostItem' }
    Settlement:
      type: object
      required: [billingMonth, finalizedAt, billedCost, currency]
      properties:
        billingMonth: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        finalizedAt: { type: string, format: date-time }
        billedCost: { type: number }
        currency: { type: string, const: KRW }
    UsageRecord:
      type: object
      required:
        - source
        - id
        - ChargePeriodStart
        - ChargePeriodEnd
        - ResourceId
        - ServiceCategory
        - SkuMeter
        - ConsumedQuantity
        - ConsumedUnit
      properties:
        source: { type: string, format: uri-reference }
        id: { type: string }
        ChargePeriodStart: { type: string, format: date-time }
        ChargePeriodEnd: { type: string, format: date-time }
        ResourceId: { type: string }
        ServiceCategory: { type: string, enum: [Compute, Storage, Networking] }
        SkuMeter: { type: string }
        ConsumedQuantity: { type: integer, minimum: 0 }
        ConsumedUnit: { type: string }
    UsageRecordPage:
      type: object
      required: [items, hasNext]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UsageRecord' }
        nextCursor:
          type: [string, 'null']
          description: 내부 정렬 키를 노출하지 않는 변조 방지 커서
        hasNext: { type: boolean }
    BillingMember:
      type: object
      required: [userId, displayName, email, role]
      properties:
        userId: { type: string }
        displayName: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/BillingRole' }
    Error:
      type: object
      required: [code, message, traceId]
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
      additionalProperties: false
  responses:
    BadRequest:
      description: 요청 형식·기간·필터 오류
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 인증되지 않음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 역할 부족
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 자원이 없거나 현재 회사 범위에 없음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 역할 변경 충돌 또는 마지막 Admin 제거
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: 사용량 의미 규칙 위반
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Kafka에 내구성 있게 기록할 수 없음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
