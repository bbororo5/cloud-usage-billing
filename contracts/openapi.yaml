openapi: 3.1.0
info:
  title: Cloud Usage Billing API
  version: 1.0.0
  description: 사용자 BFF 계약. deprecated 수집 API는 전환 전 구현 호환용이며 목표 구조에서는 Kafka 직접 발행으로 대체한다.
servers:
  - url: /api/v1
tags:
  - name: Session
    description: 사용자 인증 상태
  - name: Costs
    description: 예상 비용 분석
  - name: Settlements
    description: 월간 확정 결과
  - name: Usage
    description: 원본 사용량
  - name: Members
    description: 과금 역할 관리
  - name: Ingestion
    description: 사용량 이벤트 수집
paths:
  /session:
    post:
      tags: [Session]
      operationId: createSession
      summary: 로그인
      description: 유효한 인증 세션이 있으면 409로 거부하고 기존 신원과 세션 ID를 유지한다. 계정 변경은 로그아웃 후 로그인한다.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: 로그인 성공
          headers:
            Set-Cookie:
              schema:
                type: string
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/SessionConflict' }
        '503': { $ref: '#/components/responses/UserUnavailable' }
    delete:
      tags: [Session]
      operationId: deleteSession
      summary: 로그아웃
      description: 서버 세션 폐기가 완료된 뒤 세션을 검사하는 요청은 401로 거부한다. 이미 세션 검증을 마친 요청은 인가·공개 검사를 계속 수행한다.
      security:
        - UserSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: 로그아웃 성공 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/UserUnavailable' }
  /me:
    get:
      tags: [Session]
      operationId: getCurrentUser
      summary: 현재 사용자·회사·역할 조회
      security:
        - UserSession: []
      responses:
        '200':
          description: 현재 인증 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/UserUnavailable' }
  /costs:
    get:
      tags: [Costs]
      operationId: queryCosts
      summary: 예상 비용 조회
      description: groupBy가 없으면 선택 기간 총액을 반환한다. 요청한 회사·범위에 공개 보류가 있으면 전체 요청을 503으로 응답하고 부분 총계는 반환하지 않는다.
      security:
        - UserSession: []
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: serviceCategory
          in: query
          schema:
            type: string
            enum: [Compute, Storage, Networking]
        - name: resourceId
          in: query
          schema: { type: string, minLength: 1 }
        - name: groupBy
          in: query
          description: 쉼표로 구분하며 최대 2개
          style: form
          explode: false
          schema:
            type: array
            maxItems: 2
            uniqueItems: true
            items:
              type: string
              enum: [day, service, resource]
        - name: sort
          in: query
          schema:
            type: string
            enum: [cost, usage, period]
            default: cost
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: 예상 비용 집계
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/CostUnavailable' }
  /settlements/{billingMonth}:
    get:
      tags: [Settlements]
      operationId: getSettlement
      summary: 월간 확정 금액 조회
      description: 확정 상태와 공개 가능성을 확인해 반환한다. 공개 보류 또는 의존 저장소 장애는 503이며 아직 확정 결과가 없는 경우와 구분한다.
      security:
        - UserSession: []
      parameters:
        - name: billingMonth
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          example: 2026-07
      responses:
        '200':
          description: 확정 정산 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/UserUnavailable' }
  /usage-records:
    get:
      tags: [Usage]
      operationId: listUsageRecords
      summary: 원본 사용량 상세 조회
      description: 승인된 귀속 개정만 조회한다. 요청한 회사·범위에 공개 보류가 있으면 해당 페이지 전체를 503으로 응답한다. 다른 안전 범위의 독립 조회는 허용한다.
      security:
        - UserSession: []
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: serviceCategory
          in: query
          schema:
            type: string
            enum: [Compute, Storage, Networking]
        - name: resourceId
          in: query
          schema: { type: string, minLength: 1 }
        - name: cursor
          in: query
          description: 서버가 발급한 불투명한 다음 페이지 커서
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: 원본 사용량 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageRecordPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/UserUnavailable' }
  /billing-members:
    get:
      tags: [Members]
      operationId: listBillingMembers
      summary: 과금 구성원과 역할 조회
      security:
        - UserSession: []
      responses:
        '200':
          description: 현재 회사의 과금 구성원
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BillingMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/UserUnavailable' }
  /billing-members/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Members]
      operationId: putBillingMemberRole
      summary: 과금 역할 부여 또는 변경
      description: 변경 완료 시 관련 세션을 폐기한다. 이미 인가를 통과한 업무는 완료할 수 있으며 이후 인가에는 현재 소속·역할을 적용한다.
      security:
        - UserSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/BillingRole' }
              additionalProperties: false
      responses:
        '200':
          description: 변경된 구성원
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/UserUnavailable' }
    delete:
      tags: [Members]
      operationId: deleteBillingMemberRole
      summary: 과금 역할 제거
      description: 제거 완료 시 관련 세션을 폐기한다. 이미 인가를 통과한 업무는 완료할 수 있으며 이후 인가에는 현재 소속·역할을 적용한다.
      security:
        - UserSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: 역할 제거 성공 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/UserUnavailable' }
  /usage-events:
    post:
      deprecated: true
      tags: [Ingestion]
      operationId: ingestUsageEvent
      summary: 사용량 이벤트 검증 및 Kafka 내구성 기록
      description: 이전 HTTP 수집 경로의 계약이다. ADR-010에 따라 Kafka 직접 발행으로 대체하며, 기존 코드 전환 전까지 호환 기록으로 유지한다.
      security:
        - ProducerCredential: []
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: './v1/instance-usage-event.schema.json'
      responses:
        '202': { description: Kafka에 내구성 있게 기록됨 }
        '400': { $ref: '#/components/responses/LegacyBadRequest' }
        '401': { $ref: '#/components/responses/LegacyUnauthorized' }
        '403': { $ref: '#/components/responses/LegacyForbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    UserSession:
      type: apiKey
      in: cookie
      name: SESSION
      description: HttpOnly·Secure·SameSite=Strict 서버 세션 쿠키. 비활동 30분 만료이며 서버 시각이 마지막 접근+30분 이상이면 무효다. 유효 세션으로 인증된 요청 시작 시 접근을 갱신하며 절대 만료는 별도로 두지 않는다.
    ProducerCredential:
      type: http
      scheme: bearer
      bearerFormat: opaque-producer-credential
      description: 이벤트 발생기용 불투명 자격 증명
  parameters:
    From:
      name: from
      in: query
      required: true
      description: 포함되는 UTC 분 경계 시작 시각
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      required: true
      description: 제외되는 UTC 분 경계 종료 시각, from부터 최대 31일
      schema: { type: string, format: date-time }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    BillingRole:
      type: string
      enum: [BILLING_ACCOUNT_VIEWER, BILLING_ACCOUNT_ADMIN]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 1 }
      additionalProperties: false
    CurrentUser:
      type: object
      required: [userId, displayName, billingAccountId, billingAccountName, role]
      properties:
        userId: { type: string }
        displayName: { type: string }
        billingAccountId: { type: string }
        billingAccountName: { type: string }
        role: { $ref: '#/components/schemas/BillingRole' }
    Period:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    CostDimensions:
      type: object
      properties:
        day: { type: string, format: date }
        service: { type: string, enum: [Compute, Storage, Networking] }
        resource: { type: string }
      additionalProperties: false
    UsageAmount:
      type: object
      required: [meter, quantity, unit]
      properties:
        meter: { type: string }
        quantity: { type: integer, minimum: 0 }
        unit: { type: string }
    CostItem:
      type: object
      required: [dimensions, estimatedCost, usage]
      properties:
        dimensions: { $ref: '#/components/schemas/CostDimensions' }
        estimatedCost: { type: number }
        usage:
          type: array
          items: { $ref: '#/components/schemas/UsageAmount' }
    CostResponse:
      type: object
      required: [period, dataAsOf, currency, groupBy, items]
      properties:
        period: { $ref: '#/components/schemas/Period' }
        dataAsOf: { type: [string, 'null'], format: date-time }
        currency: { type: string, const: KRW }
        groupBy:
          type: array
          maxItems: 2
          items: { type: string, enum: [day, service, resource] }
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/CostItem' }
    Settlement:
      type: object
      required: [billingMonth, finalizedAt, billedCost, currency]
      properties:
        billingMonth: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        finalizedAt: { type: string, format: date-time }
        billedCost: { type: number }
        currency: { type: string, const: KRW }
    UsageRecord:
      type: object
      required:
        - source
        - id
        - ChargePeriodStart
        - ChargePeriodEnd
        - ResourceId
        - ServiceCategory
        - SkuMeter
        - ConsumedQuantity
        - ConsumedUnit
      properties:
        source: { type: string, format: uri-reference }
        id: { type: string }
        ChargePeriodStart: { type: string, format: date-time }
        ChargePeriodEnd: { type: string, format: date-time }
        ResourceId: { type: string }
        ServiceCategory: { type: string, enum: [Compute, Storage, Networking] }
        SkuMeter: { type: string }
        ConsumedQuantity: { type: integer, minimum: 0 }
        ConsumedUnit: { type: string }
    UsageRecordPage:
      type: object
      required: [items, hasNext]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UsageRecord' }
        nextCursor:
          type: [string, 'null']
          description: 내부 정렬 키를 노출하지 않는 변조 방지 커서
        hasNext: { type: boolean }
    BillingMember:
      type: object
      required: [userId, displayName, email, role]
      properties:
        userId: { type: string }
        displayName: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/BillingRole' }
    Error:
      type: object
      required: [code, traceId]
      properties:
        code: { type: string }
        traceId: { type: string }
      additionalProperties: false
    LegacyIngestionError:
      description: deprecated HTTP 수집 구현 전용. 신규 사용자 API에서는 사용하지 않는다.
      type: object
      required: [code, message, traceId]
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
      additionalProperties: false
  responses:
    BadRequest:
      description: 요청 형식·기간·필터 오류
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 인증되지 않음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 역할 부족 또는 CSRF 검증 실패
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 자원이 없거나 현재 회사 범위에 없음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 역할 변경 충돌 또는 마지막 Admin 제거
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    SessionConflict:
      description: 유효한 인증 세션으로 재로그인 시도. 기존 신원·세션 ID는 유지됨
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: SESSION_ALREADY_AUTHENTICATED, traceId: trace-example }
    UserUnavailable:
      description: 요청을 안전하게 처리할 수 없음. 내부 원인·비공개 범위·데이터 개수는 공개하지 않음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: SERVICE_UNAVAILABLE, traceId: trace-example }
    UnprocessableEntity:
      description: 사용량 의미 규칙 위반
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/LegacyIngestionError' }
    PayloadTooLarge:
      description: 이벤트 payload 크기 제한 초과
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/LegacyIngestionError' }
    ServiceUnavailable:
      description: Kafka에 내구성 있게 기록할 수 없음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/LegacyIngestionError' }
    LegacyBadRequest:
      description: 이전 HTTP 수집 요청 형식 오류
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/LegacyIngestionError' }
    LegacyUnauthorized:
      description: 이전 HTTP 수집 인증 실패
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/LegacyIngestionError' }
    LegacyForbidden:
      description: 이전 HTTP 수집 권한 부족
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/LegacyIngestionError' }
    CostUnavailable:
      description: 공개 보류·가격 누락·가격 사본 버전 불일치 또는 의존 저장소 장애로 비용 계산 불가. 부분 총계·내부 원인·비공개 범위·데이터 개수는 반환하지 않음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: SERVICE_UNAVAILABLE, traceId: trace-example }
