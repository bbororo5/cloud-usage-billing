name: cloud-usage-billing
include:
  - compose.ingestion.yaml
services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing_owner
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/postgresql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/postgresql/local-roles.sql:/docker-entrypoint-initdb.d/002-local-roles.sql:ro
      - ./database/postgresql/guard-privileges.sql:/docker-entrypoint-initdb.d/003-guard-privileges.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U billing_owner -d billing']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
