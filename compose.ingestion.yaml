# Local-only stack: no Kafka/ClickHouse host ports, no production credentials.
x-broker: &broker
  image: apache/kafka:4.3.1
  volumes:
    - ./config/local:/config:ro
  healthcheck:
    test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --command-config /config/kafka-admin.properties --list >/dev/null']
    interval: 5s
    timeout: 10s
    retries: 30
x-broker-env: &broker-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
  KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
  KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
  KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="local-admin-only" user_admin="local-admin-only" user_generator="local-generator-only" user_ingestion="local-ingestion-only";'
  KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="local-admin-only" user_admin="local-admin-only";'
  KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
  KAFKA_SUPER_USERS: User:admin
  KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  KAFKA_HEAP_OPTS: '-Xms256m -Xmx512m'
services:
  kafka-1:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092
    volumes:
      - ./config/local:/config:ro
      - ingestion-kafka-1:/var/lib/kafka/data
  kafka-2:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092
    volumes:
      - ./config/local:/config:ro
      - ingestion-kafka-2:/var/lib/kafka/data
  kafka-3:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092
    volumes:
      - ./config/local:/config:ro
      - ingestion-kafka-3:/var/lib/kafka/data
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    volumes:
      - ./config/local:/config:ro
      - ./scripts/init-ingestion-kafka.sh:/init.sh:ro
    entrypoint: [bash, /init.sh]
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_DB: billing
      CLICKHOUSE_USER: billing_owner
      CLICKHOUSE_PASSWORD: local-dev-only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ingestion-clickhouse:/var/lib/clickhouse
      - ./database/clickhouse/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./config/local/clickhouse-kafka.xml:/etc/clickhouse-server/config.d/kafka.xml:ro
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user billing_owner --password local-dev-only -q "select 1" >/dev/null']
      interval: 3s
      timeout: 5s
      retries: 30
  generator:
    image: eclipse-temurin:21-jre
    profiles: [generator]
    volumes:
      - ./apps/usage-generator/build/install/usage-generator:/app:ro
      - ./config/local/kafka-producer.properties:/config/kafka-producer.properties:ro
    entrypoint: [/app/bin/usage-generator]
volumes:
  ingestion-kafka-1:
  ingestion-kafka-2:
  ingestion-kafka-3:
  ingestion-clickhouse:
